name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies (if any)
        run: npm ci --ignore-scripts --no-audit --no-fund || npm install --ignore-scripts --no-audit --no-fund

      - name: Run web tests
        run: node scripts/test-api.js

      - name: Check internal links
        run: node scripts/check-links.js

      - name: Validate JSON data
        run: node -e "['public/data/commands.json','public/data/site-data.json','public/manifest.webmanifest','public/site.webmanifest'].forEach(f=>{JSON.parse(require('fs').readFileSync(f,'utf8'));console.log('ok',f)})"

  lighthouse:
    runs-on: ubuntu-latest
    needs: web-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Serve static site
        run: |
          npx --yes serve web/public -l 4173 &
          sleep 2

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4173/index.html
            http://localhost:4173/commandes.html
            http://localhost:4173/connexion.html
          uploadArtifacts: true
          temporaryPublicStorage: false
          runs: 1
        continue-on-error: true
