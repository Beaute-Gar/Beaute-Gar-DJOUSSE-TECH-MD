# Render — NB : renseigner « Blueprint Path » = deployment/render.yaml (Dashboard).
# Render — service « worker » (type: worker : AUCUN port à exposer,
# contrairement à un service web). Le bot tourne en continu, mais il n'a
# pas de console interactive : appaire une fois en local puis copie
# storage/sessions/ sur le disque, ou utilise le Shell du service.
#
# Session éphémère sur le plan gratuit : à chaque redémarrage/deploiement,
# un réappairage est nécessaire et la configuration des groupes est perdue.
# Pour la persister, attacher un disque (Settings → Disks, plan payant)
# monté sur /app/storage : un seul volume suffit (sessions, base, jeux, logs).
services:
  - type: worker
    name: djousse-tech-md
    runtime: docker
    dockerfilePath: ./deployment/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: OWNER_NUMBER
        sync: false
      - key: PREFIX
        sync: false
      - key: GEMINI_KEY
        sync: false
    # Plan payant uniquement : un disque pour conserver storage/ entre les redémarrages.
    # disk:
    #   name: djousse-state
    #   mountPath: /app/storage
    #   sizeGB: 1
