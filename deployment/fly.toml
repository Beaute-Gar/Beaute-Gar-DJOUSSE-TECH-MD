# fly.toml — Fly.io (aucun service HTTP : le bot est un worker pur).
#
#   fly volumes create djousse_state --size 1 --region cdg
#   fly secrets set OWNER_NUMBER=2376... GEMINI_KEY=...
#   fly deploy --config deployment/fly.toml --dockerfile deployment/Dockerfile
#
# Le volume persiste tout storage/ (sessions, base, jeux, logs). Pas de
# console interactive : appaire en local puis copie storage/sessions/ sur
# le volume, ou passe par `fly ssh console`.
app = 'djousse-tech-md'
primary_region = 'cdg'

[build]
  [build.args]
    NODE_VERSION = '22'

[env]
  NODE_ENV = 'production'

[processes]
  app = 'node index.js'

[mounts]
  source = 'djousse_state'
  destination = '/app/storage'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
