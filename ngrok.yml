# ngrok.yml — configuration du tunnel (domaine fixe)
# Authtoken déjà enregistré en local via: ngrok config add-authtoken <TOKEN>
# Lancer: ngrok start --config=ngrok.yml backend
# Le backend doit écouter sur 127.0.0.1:3001.

version: "2"
tunnels:
  backend:
    proto: http
    addr: 127.0.0.1:3001
    domain: renitent-gennie-moonishly.ngrok-free.dev
    # Compte gratuit: domaine fixe inclus. Vérifier dans le dashboard les limites de session/trafic.
    # Le front doit envoyer l'en-tête: ngrok-skip-browser-warning: 1
